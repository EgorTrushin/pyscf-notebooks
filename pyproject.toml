[project]
name = "pyscf-notebooks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "basis-set-exchange>=0.12",
    "jupyter-book>=1,<2",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyscf>=2.14.0",
    "ruff>=0.17.2",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
# long-line geometry data
extend-exclude = ["notebooks/sets"]
