# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: PySCF Notebooks
author: Egor Trushin
logo: pyscf-logo.jpg

# Only build pages listed in _toc.yml; .venv/ must be excluded explicitly,
# because the toc-based exclusion skips hidden directories
only_build_toc_files: true
exclude_patterns: [.venv]

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  timeout: 600  # per cell; the slowest cell (gga_xc_potential) takes ~70 s on 4 cores

launch_buttons:
  notebook_interface: jupyterlab

# Information about where the book exists on the web
repository:
  url: https://github.com/EgorTrushin/pyscf-notebooks  # Online location of your book

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true